name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Match the Swift 6.4 toolchain used to validate the version tags locally.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run checks
        run: scripts/test_all.sh
      - name: Build app bundle
        run: scripts/build_app.sh "$RUNNER_TEMP/RcHarness.app"
